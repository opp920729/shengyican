<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="早餐、午餐、晚餐、宵夜的連鎖餐飲優惠，每天更新，依 CP 值排名，附附近門市地圖。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="省一餐">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>省一餐</title>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: a coupon book. Each deal is a coupon — price and details on the left, a tear-off stub with the code on the right. */
:root{
  --bg:#eef1f4; --card:#ffffff; --ink:#15181d; --muted:#5f6875; --faint:#8c94a0; --line:#dde2e8;
  --red:#d9341a; --yellow:#ffd400; --yellow-ink:#1d1700; --green:#0e7a4a; --chip:#e6eaef; --chip-on:#15181d; --chip-on-ink:#ffffff;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Barlow Semi Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1216; --card:#1a1f26; --ink:#eef1f4; --muted:#a0a9b6; --faint:#77808c; --line:#2b323c;
  --red:#ff6a52; --yellow:#ffd400; --yellow-ink:#1d1700; --green:#45c98b; --chip:#252c35; --chip-on:#eef1f4; --chip-on-ink:#0f1216; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1216; --card:#1a1f26; --ink:#eef1f4; --muted:#a0a9b6; --faint:#77808c; --line:#2b323c;
  --red:#ff6a52; --yellow:#ffd400; --yellow-ink:#1d1700; --green:#45c98b; --chip:#252c35; --chip-on:#eef1f4; --chip-on-ink:#0f1216; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;letter-spacing:.04em}
.mark{width:26px;height:26px;border-radius:6px;background:var(--yellow);color:var(--yellow-ink);display:grid;place-items:center;font-size:15px;font-weight:900;transform:rotate(-6deg)}
.upd{font-size:12px;color:var(--muted);text-align:right;line-height:1.4}
.meals{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-bottom:10px}
.meals button{border:0;background:var(--chip);border-radius:8px;padding:8px 0 7px;line-height:1.2}
.meals b{display:block;font-size:15px}
.meals small{font-size:11px;color:var(--muted)}
.meals button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.meals button[aria-pressed="true"] small{color:inherit;opacity:.7}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;padding-block:12px 4px}
.ctl{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.ctl .k{color:var(--muted);font-size:13px}
.ctl .pin{width:15px;height:15px;color:var(--muted);flex:none}
@media (max-width:420px){.filters{gap:6px;flex-wrap:nowrap}.ctl{padding:0 9px;gap:3px}.ctl input{width:3.4ch}.ctl .k.opt{display:none}}
.ctl select{border:0;background:transparent;font-weight:700;appearance:none;-webkit-appearance:none;padding-right:14px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:right 4px center,right 0 center;background-size:5px 5px;background-repeat:no-repeat}
.ctl input{border:0;background:transparent;width:4.2ch;font-weight:700;text-align:center;padding:0}
.ctl input::placeholder{color:var(--faint);font-weight:500}
.step{border:0;background:var(--chip);width:24px;height:24px;border-radius:50%;line-height:1;font-size:16px;display:grid;place-items:center;padding:0}
.ctl .n{font-weight:700;min-width:1.6ch;text-align:center}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.cats{display:flex;gap:6px;overflow-x:auto;padding-block:8px 4px;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:0;background:var(--chip);border-radius:999px;padding:6px 12px;font-size:14px}
.cats button .n{color:var(--muted);font-size:12px;margin-left:3px}
.cats button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.cats button[aria-pressed="true"] .n{color:inherit;opacity:.7}
.sort{display:flex;align-items:center;gap:16px;padding-block:10px 8px;font-size:14px}
.sort button{border:0;background:none;padding:2px 0;color:var(--muted)}
.sort button[aria-pressed="true"]{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px var(--red)}
.sort .count{margin-left:auto;color:var(--muted);font-size:13px}

/* coupons */
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.coupon{background:var(--card);border-radius:10px;overflow:hidden}
.coupon summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr 92px;min-height:118px}
.coupon summary::-webkit-details-marker{display:none}
.body{padding:12px 12px 12px 14px;min-width:0;display:flex;flex-direction:column;gap:4px}
.who{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.who b{color:var(--ink);font-weight:700;font-size:13px}
.t{font-weight:700;font-size:15px;line-height:1.4;text-wrap:pretty}
.money{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:2px}
.price{font-family:var(--f-num);font-weight:700;font-size:30px;line-height:1;color:var(--red);letter-spacing:-.01em}
.price small{font-size:17px;margin-right:1px}
.gift{font-weight:900;font-size:17px;color:var(--red);line-height:1.2}
.orig{font-size:12px;color:var(--faint);text-decoration:line-through}
.off{font-size:12px;font-weight:700;background:var(--yellow);color:var(--yellow-ink);padding:1px 6px;border-radius:4px}
.each{font-size:12px;color:var(--muted)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--muted)}
.tag.hot{background:var(--red);color:#fff}
.tag.buy{background:transparent;box-shadow:inset 0 0 0 1px var(--green);color:var(--green)}

.stub{position:relative;border-left:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 6px;text-align:center}
.stub::before,.stub::after{content:"";position:absolute;left:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.stub::before{top:-9px}.stub::after{bottom:-9px}
.stub .lbl{font-size:11px;color:var(--muted)}
.stub .code{font-family:var(--f-num);font-weight:700;font-size:20px;letter-spacing:.04em;line-height:1.1;word-break:break-all}
.stub .code.zh{font-family:var(--f-body);font-size:14px;letter-spacing:0}
.stub .way{font-size:13px;font-weight:700;line-height:1.3}
.stub .more{font-size:11px;color:var(--faint);margin-top:4px}
details[open] .stub .more{visibility:hidden}

.detail{border-top:1px solid var(--line);padding:12px 14px 14px;display:grid;gap:10px;font-size:14px}
.detail dl{margin:0;display:grid;grid-template-columns:4em 1fr;gap:6px 10px}
.detail dt{color:var(--muted)}
.detail dd{margin:0;min-width:0}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:8px;font-size:14px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn.main{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn.buy{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow)}
.btn.src{border:0;padding:0 4px;font-weight:500;color:var(--muted)}
.btn svg{width:16px;height:16px;flex:none}

.empty{background:var(--card);border-radius:10px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.near{margin-top:22px}
.near h2,.foot h2{font-size:14px;margin:0 0 8px}
.near .acts .btn{height:34px;font-weight:500}
.foot{margin-top:28px;font-size:12px;color:var(--muted);display:grid;gap:6px}
.foot p{margin:0;max-width:60ch}
.foot .site{margin-top:6px;font-weight:700;color:var(--faint);letter-spacing:.04em}

.wm{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:15;pointer-events:none;
  font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--ink);opacity:.18}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--card);padding:9px 14px;border-radius:8px;font-size:13px;max-width:calc(100% - 32px)}
@media (max-width:380px){.coupon summary{grid-template-columns:1fr 80px}.price{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="top">
  <div class="wrap gut">
    <div class="bar">
      <div class="brand"><span class="mark" aria-hidden="true">省</span>省一餐</div>
      <div class="upd"><span id="today"></span><br><span id="updated">讀取中</span></div>
    </div>
    <nav class="meals" aria-label="餐別">
      <button id="m-早餐" data-meal="早餐"><b>早餐</b><small>5:00–10:30</small></button>
      <button id="m-午餐" data-meal="午餐"><b>午餐</b><small>10:30–14:00</small></button>
      <button id="m-晚餐" data-meal="晚餐"><b>晚餐</b><small>14:00–21:00</small></button>
      <button id="m-宵夜" data-meal="宵夜"><b>宵夜</b><small>21:00 以後</small></button>
    </nav>
  </div>
</header>

<main class="wrap gut">
  <div class="filters">
    <label class="ctl" for="region" aria-label="地區"><svg class="pin" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 14.5s4.5-4.2 4.5-8a4.5 4.5 0 1 0-9 0c0 3.8 4.5 8 4.5 8Z"/><circle cx="8" cy="6.5" r="1.6"/></svg>
      <select id="region">
        <option value="">目前位置</option>
        <option>台北市</option><option>新北市</option><option>基隆市</option><option>桃園市</option>
        <option>新竹市</option><option>新竹縣</option><option>苗栗縣</option><option>台中市</option>
        <option>彰化縣</option><option>南投縣</option><option>雲林縣</option><option>嘉義市</option>
        <option>嘉義縣</option><option>台南市</option><option>高雄市</option><option>屏東縣</option>
        <option>宜蘭縣</option><option>花蓮縣</option><option>台東縣</option><option>澎湖縣</option>
        <option>金門縣</option><option>連江縣</option>
      </select>
    </label>
    <label class="ctl" for="budget" aria-label="每人預算"><span class="k opt">每人</span>$<input id="budget" type="number" inputmode="numeric" min="0" step="10" placeholder="不限"><span class="k">以下</span></label>
    <div class="ctl" role="group" aria-label="人數">
      <button type="button" class="step" id="ppl-dec" aria-label="少一人">−</button>
      <span class="n" id="ppl-n">1</span><span class="k">人</span>
      <button type="button" class="step" id="ppl-inc" aria-label="多一人">+</button>
    </div>
  </div>
  <div class="cats" id="cats" role="group" aria-label="種類"></div>
  <div class="sort" role="group" aria-label="排序">
    <button id="s-cp" data-sort="cp">最划算</button>
    <button id="s-pp" data-sort="pp">最便宜</button>
    <button id="s-end" data-sort="end">快到期</button>
    <span class="count" id="count"></span>
  </div>

  <ul class="list" id="rows"><li class="empty"><b>載入中</b>正在取得今天的優惠</li></ul>

  <section class="near" id="near"></section>

  <footer class="foot">
    <h2>關於排序</h2>
    <p>「最划算」看兩件事：比原價便宜多少，以及每人要花多少。沒有原價的優惠只看每人花費。人數會影響計算，例如 3 人份的桶子 4 個人吃，就算買 2 桶。</p>
    <p>價格和期限來自官方公告和優惠整理網站，各門市可能不同，請以現場為準。過期的優惠會自動隱藏。「momo 購買」是推廣連結，從這裡買不會多付錢。</p>
    <p class="site">SHENGYICAN.PAGES.DEV · 每天早上更新</p>
  </footer>
</main>
<div class="wm" aria-hidden="true">省一餐</div>
<div class="toast" id="toast" hidden></div>

<script>
const NOW = new Date();
const pad = n => String(n).padStart(2, "0");
const todayStr = NOW.getFullYear() + "-" + pad(NOW.getMonth() + 1) + "-" + pad(NOW.getDate());
document.getElementById("today").textContent = (NOW.getMonth() + 1) + "月" + NOW.getDate() + "日 週" + "日一二三四五六"[NOW.getDay()];

const CAT_ORDER = ["早餐店","漢堡速食","披薩","炸雞","雞排鹹酥雞","滷味","便當","丼飯","麵","壽司","火鍋","小吃","超商","甜點","冰品","飲料","外送"];
const NEAR = {
  "早餐": ["早餐店","蛋餅","飯糰","豆漿店","麥當勞"],
  "午餐": ["便當","自助餐","麵店","牛肉麵","水餃"],
  "晚餐": ["自助餐","便當","拉麵","火鍋","壽司"],
  "宵夜": ["鹹酥雞","滷味","炸雞","清粥小菜","豆花"]
};
const ICON = {
  pin: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 14.5s4.5-4.2 4.5-8a4.5 4.5 0 1 0-9 0c0 3.8 4.5 8 4.5 8Z"/><circle cx="8" cy="6.5" r="1.6"/></svg>',
  bag: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 5.5h10l-.8 8.5H3.8L3 5.5Z"/><path d="M5.5 5.5V4a2.5 2.5 0 0 1 5 0v1.5"/></svg>',
  copy: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="5" width="8.5" height="8.5" rx="1"/><path d="M3 10.5V3.5A1 1 0 0 1 4 2.5h6.5"/></svg>'
};

function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } }
let DEALS = [];
let meal = pickMeal();
let sort = store("sy.sort") || "cp";
let region = store("sy.region") || "";
let budget = Number(store("sy.budget")) || 0;
let ppl = Math.min(20, Math.max(1, Number(store("sy.ppl")) || 1));
let cat = store("sy.cat") || "";

function pickMeal(){
  const h = NOW.getHours() + NOW.getMinutes() / 60;
  if (h >= 5 && h < 10.5) return "早餐";
  if (h >= 10.5 && h < 14) return "午餐";
  if (h >= 14 && h < 21) return "晚餐";
  return "宵夜";
}
const num = v => (typeof v === "number" && isFinite(v)) ? v : null;
function plan(d){
  const p = num(d.price); if (p === null) return null;
  const size = num(d.people) || 1, sets = Math.ceil(ppl / size), total = sets * p;
  return { size, sets, total, each: total / ppl };
}
const perPerson = d => { const pl = plan(d); return pl ? pl.each : null; };
function ratio(d){
  const p = num(d.price), o = num(d.orig);
  if (p !== null && o && o > p) return (o - p) / o;
  return num(d.pct);
}
function score(d){
  const r = ratio(d), pp = perPerson(d);
  let s = 0;
  if (r !== null) s += r * 70;
  if (pp !== null) s += Math.max(0, 1 - Math.min(pp, 200) / 200) * 30;
  return s;
}
function daysLeft(d){ if (!d.ends) return null; return Math.floor((new Date(d.ends + "T23:59:59") - NOW) / 86400000); }
const active = d => !d.ends || d.ends >= todayStr;
const inRegion = d => !Array.isArray(d.regions) || !d.regions.length || (region && d.regions.includes(region));
const mapUrl = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q + (region ? " " + region : " 附近"));
function el(tag, cls, text){ const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function fmtEnd(d){ if (!d.ends) return "未公布，以官方為準"; const [, m, dd] = d.ends.split("-"); return Number(m) + " 月 " + Number(dd) + " 日"; }
function howShort(d){
  if (d.buy) return (d.buyName || "線上") + " 買券";
  const h = d.how || "";
  if (/APP|app/.test(h) && /領/.test(h)) return "APP 領券";
  if (/座位點餐/.test(h)) return "掃碼點餐";
  if (/得來速/.test(h)) return "得來速";
  if (/外帶/.test(h) && !/內用/.test(h)) return "限外帶";
  return "到店點";
}

function render(){
  document.querySelectorAll(".meals button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.meal === meal)));
  document.querySelectorAll(".sort button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.sort === sort)));
  const base = DEALS.filter(d => active(d) && inRegion(d) && Array.isArray(d.meals) && d.meals.includes(meal));
  const counts = {};
  base.forEach(d => counts[d.cat] = (counts[d.cat] || 0) + 1);
  const present = CAT_ORDER.filter(c => counts[c]).concat(Object.keys(counts).filter(c => c && !CAT_ORDER.includes(c)));
  if (cat && !counts[cat]) cat = "";

  const cats = document.getElementById("cats"); cats.textContent = "";
  [""].concat(present).forEach(c => {
    const b = el("button"); b.type = "button"; b.id = "c-" + (c || "all");
    b.setAttribute("aria-pressed", String(c === cat));
    b.appendChild(document.createTextNode(c || "全部"));
    b.appendChild(el("span", "n", String(c ? counts[c] : base.length)));
    b.onclick = () => { cat = c; store("sy.cat", cat); render(); };
    cats.appendChild(b);
  });

  let rows = base.filter(d => !cat || d.cat === cat);
  if (budget > 0) rows = rows.filter(d => { const pp = perPerson(d); return pp !== null && pp <= budget; });
  rows.forEach(d => d._s = score(d));
  if (sort === "cp") rows.sort((a, b) => b._s - a._s || (perPerson(a) ?? 1e9) - (perPerson(b) ?? 1e9));
  if (sort === "pp") rows.sort((a, b) => (perPerson(a) ?? 1e9) - (perPerson(b) ?? 1e9));
  if (sort === "end") rows.sort((a, b) => (a.ends || "9999").localeCompare(b.ends || "9999"));

  document.getElementById("count").textContent = rows.length + " 個優惠";
  const list = document.getElementById("rows"); list.textContent = "";
  if (!DEALS.length) return;
  if (!rows.length){
    const li = el("li", "empty");
    li.appendChild(el("b", null, "沒有符合條件的優惠"));
    li.appendChild(document.createTextNode(budget ? "試試調高預算，或換個種類。" : "換個餐別或種類看看，也可以直接找附近的店。"));
    list.appendChild(li);
  }
  rows.forEach(d => list.appendChild(coupon(d)));
  renderNear();
}

function coupon(d){
  const li = el("li"); const det = el("details", "coupon"); const sum = el("summary");
  const body = el("div", "body");
  const who = el("div", "who"); who.appendChild(el("b", null, d.brand)); who.appendChild(el("span", null, d.cat)); body.appendChild(who);
  body.appendChild(el("div", "t", d.title));

  const money = el("div", "money");
  const pl = plan(d);
  if (pl){
    const p = el("span", "price"); p.appendChild(el("small", null, "$")); p.appendChild(document.createTextNode(String(d.price))); money.appendChild(p);
    if (num(d.orig)) money.appendChild(el("span", "orig", "$" + d.orig));
    const r = ratio(d);
    if (num(d.orig) && d.orig > d.price) money.appendChild(el("span", "off", "省 $" + (d.orig - d.price)));
    else if (r !== null) money.appendChild(el("span", "off", "省 " + Math.round(r * 100) + "%"));
  } else {
    money.appendChild(el("span", "gift", d.gift || "加碼優惠"));
    const r = ratio(d); if (r !== null) money.appendChild(el("span", "off", "省 " + Math.round(r * 100) + "%"));
  }
  body.appendChild(money);
  if (pl && ppl > 1) body.appendChild(el("div", "each", ppl + " 人要買 " + pl.sets + " 份，共 $" + pl.total + "，每人約 $" + Math.round(pl.each)));
  else if (pl && pl.size > 1) body.appendChild(el("div", "each", pl.size + " 人份"));

  const tags = el("div", "tags");
  const left = daysLeft(d);
  if (left !== null && left <= 2) tags.appendChild(el("span", "tag hot", left <= 0 ? "今天截止" : "剩 " + (left + 1) + " 天"));
  if (d.buy) tags.appendChild(el("span", "tag buy", "可線上買"));
  if (Array.isArray(d.regions) && d.regions.length) tags.appendChild(el("span", "tag", "限" + d.regions.join("、")));
  if (d.note && d.note.includes("確認")) tags.appendChild(el("span", "tag", "請先問門市"));
  if (tags.childNodes.length) body.appendChild(tags);
  sum.appendChild(body);

  const stub = el("div", "stub");
  if (d.code){
    stub.appendChild(el("span", "lbl", "代碼"));
    stub.appendChild(el("span", "code" + (/[^\x00-\x7f]/.test(d.code) ? " zh" : ""), d.code));
  } else {
    stub.appendChild(el("span", "lbl", "使用方式"));
    stub.appendChild(el("span", "way", howShort(d)));
  }
  stub.appendChild(el("span", "more", "點開看細節"));
  sum.appendChild(stub);
  det.appendChild(sum);

  const box = el("div", "detail"); const dl = el("dl");
  const kv = (k, v) => { dl.appendChild(el("dt", null, k)); dl.appendChild(el("dd", null, v)); };
  if (d.how) kv("怎麼用", d.how);
  kv("到期", fmtEnd(d));
  if (d.pay) kv("付款", d.pay);
  if (d.note) kv("注意", d.note);
  box.appendChild(dl);
  const acts = el("div", "acts");
  const map = el("a", "btn main"); map.href = mapUrl(d.mapq || d.brand); map.target = "_blank"; map.rel = "noopener";
  map.innerHTML = ICON.pin; map.appendChild(document.createTextNode(region ? region + "的門市" : "附近門市")); acts.appendChild(map);
  if (d.buy){ const a = el("a", "btn buy"); a.href = d.buy; a.target = "_blank"; a.rel = "noopener sponsored"; a.innerHTML = ICON.bag; a.appendChild(document.createTextNode((d.buyName || "線上") + " 購買")); acts.appendChild(a); }
  if (d.code){ const c = el("button", "btn"); c.type = "button"; c.innerHTML = ICON.copy; c.appendChild(document.createTextNode("複製代碼")); c.onclick = () => copy(d.code); acts.appendChild(c); }
  if (d.src && d.src !== d.buy){ const s = el("a", "btn src", "資料來源"); s.href = d.src; s.target = "_blank"; s.rel = "noopener"; acts.appendChild(s); }
  box.appendChild(acts);
  det.appendChild(box);
  li.appendChild(det);
  return li;
}

function renderNear(){
  const n = document.getElementById("near"); n.textContent = "";
  n.appendChild(el("h2", null, "在地圖上找" + (region || "附近") + "的" + meal));
  const w = el("div", "acts");
  NEAR[meal].forEach(q => { const a = el("a", "btn"); a.href = mapUrl(q); a.target = "_blank"; a.rel = "noopener"; a.innerHTML = ICON.pin; a.appendChild(document.createTextNode(q)); w.appendChild(a); });
  n.appendChild(w);
}

function copy(t){
  const fail = () => toast("代碼是 " + t + "，長按可以選取");
  try { navigator.clipboard.writeText(t).then(() => toast("已複製代碼 " + t), fail); } catch(e){ fail(); }
}
let tt;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2200); }

document.querySelectorAll(".meals button").forEach(b => b.onclick = () => { meal = b.dataset.meal; render(); });
document.querySelectorAll(".sort button").forEach(b => b.onclick = () => { sort = b.dataset.sort; store("sy.sort", sort); render(); });
const regionEl = document.getElementById("region"); regionEl.value = region;
regionEl.onchange = () => { region = regionEl.value; store("sy.region", region); render(); };
const budgetEl = document.getElementById("budget"); if (budget) budgetEl.value = budget;
budgetEl.oninput = () => { budget = Math.max(0, Number(budgetEl.value) || 0); store("sy.budget", String(budget || "")); render(); };
const pplN = document.getElementById("ppl-n"); pplN.textContent = ppl;
const setPpl = n => { ppl = Math.min(20, Math.max(1, n)); pplN.textContent = ppl; store("sy.ppl", String(ppl)); render(); };
document.getElementById("ppl-dec").onclick = () => setPpl(ppl - 1);
document.getElementById("ppl-inc").onclick = () => setPpl(ppl + 1);
render();

(async () => {
  const up = document.getElementById("updated");
  const list = document.getElementById("rows");
  try {
    const r = await fetch("deals.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    DEALS = Array.isArray(j.deals) ? j.deals : [];
    up.textContent = j.updatedAt ? String(j.updatedAt).slice(5) + " 更新" : "";
    if (!DEALS.length){
      list.textContent = "";
      const li = el("li", "empty"); li.appendChild(el("b", null, "今天的優惠還沒整理好")); li.appendChild(document.createTextNode("每天早上會更新，晚點再來看。"));
      list.appendChild(li); return;
    }
    render();
  } catch (e) {
    up.textContent = "";
    list.textContent = "";
    const li = el("li", "empty"); li.appendChild(el("b", null, "連不上網路")); li.appendChild(document.createTextNode("連上之後重新整理一次。"));
    list.appendChild(li);
  }
})();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
